name: Build PDF Extractor

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build macOS app
        run: |
          pyinstaller --onefile --windowed --name "PDF Extractor" pdf_extractor_app.py
          ls -la dist/
      
      - name: Create ZIP
        run: |
          cd dist
          zip -r "PDF_Extractor_macOS.zip" "PDF Extractor.app"
          ls -la
      
      - name: Upload macOS release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/PDF_Extractor_macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build Windows exe
        run: pyinstaller --onefile --windowed --name "PDF_Extractor_Windows" pdf_extractor_app.py
      
      - name: Upload Windows release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/PDF_Extractor_Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build Linux binary
        run: pyinstaller --onefile --windowed --name "PDF_Extractor_Linux" pdf_extractor_app.py
      
      - name: Upload Linux release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/PDF_Extractor_Linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
