name: Build PDF Extractor

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - run: pyinstaller --onefile --windowed --name "PDF Extractor" pdf_extractor_app.py
      
      - uses: softprops/action-gh-release@v1
        with:
          files: dist/PDF\ Extractor.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - run: pyinstaller --onefile --windowed --name "PDF Extractor" pdf_extractor_app.py
      
      - uses: softprops/action-gh-release@v1
        with:
          files: dist/PDF Extractor.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - run: pyinstaller --onefile --windowed --name "pdf-extractor" pdf_extractor_app.py
      
      - uses: softprops/action-gh-release@v1
        with:
          files: dist/pdf-extractor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}